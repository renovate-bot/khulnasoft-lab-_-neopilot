[tool.poetry]
name = "neopilot"
version = "1.5.6"
description = "NEOPILOT SDK that give agents cloud environments"
authors = ["neopilot <hello@neopilot.dev>"]
license = "MIT"
readme = "README.md"
homepage = "https://neopilot.dev/"
repository = "https://github.com/khulnasoft-lab/neopilot/tree/main/packages/python-sdk"
packages = [{ include = "neopilot" }, { include = "neopilot_connect" }]

[tool.poetry.dependencies]
python = "^3.9"

python-dateutil = ">=2.8.2"
protobuf = ">=5.29.4, <6.0.0"
httpcore = "^1.0.5"
httpx = ">=0.27.0, <1.0.0"
attrs = ">=23.2.0"
packaging = ">=24.1"
typing-extensions = ">=4.1.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
pytest = "^7.4.0"
pytest-xdist = "^3.3.1"
python-dotenv = "^1.0.0"
pytest-dotenv = "^0.5.2"
pytest-asyncio = "^0.23.7"
pydoc-markdown = "^4.8.2"
ruff = "^0.11.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/khulnasoft-lab/neopilot/issues"
